# PgBouncer in transaction mode (scalability doc §2.3).
# Postgres max connections is finite (~100); pgbouncer multiplexes the app's
# many short-lived connections into a small pool. Point DATABASE_URL at this
# (port 6432) in production.
[databases]
vaani = host=db port=5432 dbname=vaani

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
auth_type = trust
log_connections = 0
log_disconnections = 0
