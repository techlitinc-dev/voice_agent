# PostgreSQL tuning for the Small tier (deployment runbook §5.1).
# 16 GB RAM VPS → shared_buffers 4GB (25%), effective_cache_size 12GB (75%).
# Place in /etc/postgresql/16/main/conf.d/vaani.conf or pass via docker command.

shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
work_mem = 64MB
max_connections = 200
random_page_cost = 1.1          # SSD
effective_io_concurrency = 200  # SSD
log_min_duration_statement = 1000  # log queries > 1s
