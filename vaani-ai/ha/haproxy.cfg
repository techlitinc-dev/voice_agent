# HAProxy in front of the Patroni PostgreSQL cluster (disaster-recovery §3.1).
#   :5000  writes → Patroni leader (the only node accepting writes)
#   :5001  reads  → any healthy Patroni node (replicas serve read traffic)
# Patroni exposes a REST API on 8008 with /primary and /replica endpoints.
global
  log stdout format raw local0
  maxconn 5000

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 1m
  timeout server 1m

# Writes → leader
frontend pg_write_frontend
  bind *:5000
  default_backend pg_primary

backend pg_primary
  option httpchk GET /primary
  http-check expect status 200
  server patroni0 patroni0:5432 maxconn 100 check port 8008
  server patroni1 patroni1:5432 maxconn 100 check port 8008
  server patroni2 patroni2:5432 maxconn 100 check port 8008

# Reads → any healthy node (replicas preferred via weight)
frontend pg_read_frontend
  bind *:5001
  default_backend pg_replicas

backend pg_replicas
  option httpchk GET /replica
  http-check expect status 200
  server patroni0 patroni0:5432 maxconn 100 weight 10 check port 8008
  server patroni1 patroni1:5432 maxconn 100 weight 30 check port 8008
  server patroni2 patroni2:5432 maxconn 100 weight 30 check port 8008
