# Prometheus scrape config for Vaani AI (observability doc §2).
# The app exposes /api/metrics with bearer-token auth; the worker exposes
# /metrics on METRICS_PORT with the same token.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: vaani-web
    metrics_path: /api/metrics
    scheme: http
    bearer_token: ${METRICS_TOKEN}
    static_configs:
      - targets: ["app:3000"]

  - job_name: vaani-worker
    metrics_path: /metrics
    scheme: http
    bearer_token: ${METRICS_TOKEN}
    static_configs:
      - targets: ["worker:3001"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
