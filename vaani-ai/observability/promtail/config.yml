# Promtail → Loki (observability doc §3.4). Tails Docker container logs,
# parses the pino JSON lines, and forwards to Loki with level/workspaceId labels.
server:
  http_listen_port: 9080

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vaani-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            workspaceId: workspaceId
            requestId: requestId
      - labels:
          level:
          service:
          workspaceId:
